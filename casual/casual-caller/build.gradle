//-*- coding: utf-8 -*-
plugins {
    id 'java-library'
    id 'jacoco'
    id 'groovy'
}

dependencies {
  compileOnly project(":casual:casual-caller-api")
  implementation project(":casual:casual-caller-http-client")  
  compileOnly libs.casual_api
  compileOnly libs.casual_jca
  compileOnly libs.javaee_api

  implementation libs.snake_yaml
    
  testImplementation project(":casual:casual-caller-api")
  testImplementation libs.casual_api
  testImplementation libs.casual_jca
  testImplementation libs.javaee_api
  testImplementation libs.system_lambda
  testImplementation libs.jersey_client
  testImplementation libs.jersey_test
  testImplementation libs.jersey_inject
  // for spock
  testImplementation platform(libs.groovy_bom)
  testImplementation libs.groovy
  testImplementation platform(libs.spock_bom)
  testImplementation libs.spock_core
  testImplementation libs.cglib_nodep
  testImplementation libs.objenesis
}

jar{
  archiveFileName = 'casual-caller.jar'
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}



